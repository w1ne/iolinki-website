name: Browser site checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check analytics consent, privacy and outcome events
        run: npm run check:analytics
      - name: Check desktop and mobile pages and interactions
        run: npm run check:browser
      - name: Check rendered docs, version navigation and local search
        run: npm run check:docs-browser
      - name: Check the studio embed mode and the blog embeds
        run: npm run check:embed
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-browser-screenshots
          path: artifacts/browser/
          if-no-files-found: ignore
      - name: Upload docs browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-browser-screenshots
          path: artifacts/docs-browser/
          if-no-files-found: ignore

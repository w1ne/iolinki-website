name: Static site checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check pages, local links, fragments and assets
        run: python3 scripts/check_site.py

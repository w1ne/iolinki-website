name: Static site checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned documentation build tools
        run: python3 -m pip install -r docsite/requirements.txt
      - name: Verify committed documentation is reproducible
        run: python3 scripts/build_docs.py --check
      - name: Verify documentation version and source contracts
        run: python3 scripts/test_docs.py
      - name: Check search discovery and reproducible SEO metadata
        run: |
          python3 scripts/build_seo.py --check
          python3 scripts/check_seo.py
      - name: Check pages, local links, fragments and assets
        run: python3 scripts/check_site.py

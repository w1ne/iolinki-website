name: Checkout Worker checks
on: [push, pull_request]
jobs:
  checkout:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkout-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: checkout-worker/package-lock.json
      - name: Install PDF text verification tool
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: npm run check
      - run: npm run deploy

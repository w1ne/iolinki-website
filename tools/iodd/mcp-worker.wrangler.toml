name = "iolinki-iodd-mcp"
main = "mcp-worker.mjs"
account_id = "53f45abe9550f62856af4475880e0a77"
compatibility_date = "2026-09-25"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
PUBLIC_ORIGIN = "https://mcp.iolinki.com"

[[services]]
binding = "CATALOG"
service = "iolinki-iodd-catalog"

[[durable_objects.bindings]]
name = "IODD_SESSIONS"
class_name = "IoddMcpSessions"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IoddMcpSessions"]

[[rules]]
type = "Text"
globs = ["**/*.xml", "**/firmware-kit/*.c", "**/firmware-kit/*.h", "**/LICENSE.GPL-3.0"]
fallthrough = true
